<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choma Finder - Vendors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Vendor page</h1>
    <p>List your food and tell customers when you are open.</p>
  </header>

  <main>
    <p id="msg" class="msg" role="status"></p>

    <!-- 1. Log in or create an account -->
    <section id="step-login" hidden>
      <h2 id="login-title">Log in</h2>
      <label for="login-phone">Your phone number</label>
      <input id="login-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0700 000 000">
      <label for="login-pass">Password <span id="pass-hint" class="hint"></span></label>
      <input id="login-pass" type="password" autocomplete="current-password" minlength="6">
      <button id="login-go" class="big" type="button">Log in</button>
      <button id="login-switch" class="link" type="button">New here? Create an account</button>
    </section>

    <!-- 2. Listing -->
    <section id="step-listing" hidden>
      <p id="status" class="status" hidden></p>
      <div id="available-box" hidden>
        <button id="available" class="switch" type="button" aria-pressed="false">
          <span id="available-text">Available today: OFF</span>
        </button>
        <p class="hint">Switches itself off every morning.</p>
      </div>

      <h2 id="form-title">Your listing</h2>
      <form id="form">
        <label for="name">Business name</label>
        <input id="name" required maxlength="80">

        <label for="phone">Phone number customers call</label>
        <input id="phone" type="tel" inputmode="tel" required maxlength="20">

        <label for="area-pick">Area</label>
        <select id="area-pick" required></select>

        <p class="label">What you sell</p>
        <div id="sells" class="ticks"></div>

        <label for="note">Prices and notes <span id="left" class="hint"></span></label>
        <textarea id="note" maxlength="280" rows="3"></textarea>

        <label class="tick"><input id="delivers" type="checkbox"> We deliver</label>

        <button class="big" type="submit">Save listing</button>
      </form>

      <button id="remove" class="danger" type="button" hidden>Remove my listing</button>
      <button id="logout" class="link" type="button">Log out</button>
    </section>
  </main>

  <footer><a href="index.html">Back to customer page</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
  <script src="vendor.js"></script>
</body>
</html>
