<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choma Finder - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Admin</h1>
    <p>Areas, vendors and Featured slots.</p>
  </header>

  <main>
    <p id="msg" class="msg" role="status"></p>

    <section id="step-login" hidden>
      <label for="email">Admin email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="pass">Password</label>
      <input id="pass" type="password" autocomplete="current-password">
      <button id="login" class="big" type="button">Log in</button>
    </section>

    <section id="step-admin" hidden>
      <h2>Vendors</h2>
      <p id="pending" class="status" hidden></p>
      <label for="filter">Show</label>
      <select id="filter"></select>
      <div id="vendors"></div>

      <h2>Areas</h2>
      <div id="areas"></div>

      <button id="logout" class="link" type="button">Log out</button>
    </section>
  </main>

  <footer><a href="index.html">Customer page</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="admin.js"></script>
</body>
</html>
